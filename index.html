<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<style id="css">
:root{--bg:#E6EBF0;--panel:#F7F9FB;--ink:#15202C;--muted:#5A6878;--line:#C9D2DC;--accent:#F0A500;--danger:#B83A2E;--lum:40%;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F151C;--panel:#17202A;--ink:#E4EAF0;--muted:#8D9CAC;--line:#283442;--accent:#F2B705;--danger:#E0685A;--lum:46%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F151C;--panel:#17202A;--ink:#E4EAF0;--muted:#8D9CAC;--line:#283442;--accent:#F2B705;--danger:#E0685A;--lum:46%;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:14px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center}
.brand h1{margin:0;font-size:23px;font-weight:900;letter-spacing:.02em;white-space:nowrap;line-height:1.2}
.brand h1 button{all:unset;cursor:pointer;border-bottom:2px dashed var(--accent)}
.status{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.sw{position:relative;max-width:720px}
.sw svg{position:absolute;left:15px;top:14px;width:20px;height:20px;color:var(--muted);pointer-events:none}
#q{width:100%;height:48px;padding:0 16px 0 44px;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:10px;-webkit-appearance:none;appearance:none}
#q:focus{outline:none;box-shadow:0 0 0 3px var(--accent)}
.engines{margin-top:6px;font-size:13px;color:var(--muted)}
.engines a{color:var(--ink);margin-left:10px}
.actions{display:flex;gap:8px}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#15202C}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.layout{max-width:1280px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:32px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 130px);overflow:auto}
.side a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
.side a:hover{background:var(--panel)}
.side a span{color:var(--muted);font-size:12px}
.group{margin-bottom:34px}
.ghead{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.ghead h2{margin:0;font-size:17px;font-weight:700}
.count{color:var(--muted);font-size:13px}
.gtools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px}
.tw{position:relative;min-width:0}
.tile{display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;width:100%;min-height:58px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
.tile:hover{border-color:var(--ink)}
.tile.first{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.mono{grid-row:1/3;width:36px;height:36px;border-radius:7px;display:grid;place-items:center;background:hsl(var(--h) 46% var(--lum));color:#fff;font-weight:700;font-size:16px}
.mono{position:relative;overflow:hidden}
.mono img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:var(--panel)}
.tname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tdom{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tdel{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:var(--danger);color:#fff;cursor:pointer;font-size:15px;line-height:24px;padding:0}
.tile.add{display:flex;justify-content:center;border-style:dashed;background:transparent;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 18px}
.ghandle{cursor:grab;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:5px;user-select:none;-webkit-user-select:none;touch-action:none;align-self:center}
.ghandle:hover{background:var(--panel);color:var(--ink)}
.side.sorting a{cursor:grab;justify-content:flex-start}
.side.sorting a::before{content:"⠿";color:var(--muted);margin-right:6px}
.side.sorting a span{margin-left:auto}
.editing .tw[data-s] .tile{cursor:grab}
.sortable-ghost{opacity:.35}
.sortable-chosen .tile,.sortable-chosen.group .ghead{box-shadow:0 0 0 3px var(--accent)}
.sortable-drag{opacity:.95}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hero-empty{padding:40px 0;color:var(--muted);max-width:34em}
.hero-empty b{color:var(--ink)}
dialog{border:none;border-radius:12px;padding:0;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(620px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,15,20,.5)}
.dform{padding:20px}
.dform h3{margin:0 0 14px;font-size:18px}
.dform label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.dform input,.dform select,.dform textarea{display:block;width:100%;margin-top:4px;height:38px;padding:0 10px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px}
.dform textarea{height:auto;min-height:140px;padding:8px 10px;resize:vertical;font-size:13px;line-height:1.5}
.dform input[type=file]{height:auto;padding:8px}
.dform p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err{color:var(--danger)!important}
.ok{color:var(--ink)!important;font-weight:500}
.sect{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sect:first-of-type{border-top:none;margin-top:0;padding-top:0}
.sect h4{margin:0 0 4px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
.topin{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px}
.sw{grid-column:1/-1;order:3;max-width:none}
.layout{grid-template-columns:minmax(0,1fr);gap:16px;padding:14px 16px 48px}
.side{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
.side a{flex:none;background:var(--panel);border:1px solid var(--line)}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script id="app">
(function(){
'use strict';
var FONT='<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">';
var LS='nav-hub-state-v1', SS='nav-hub-ui', END='</'+'script>';
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,10)}
var CSS=$('#css').textContent, APP=$('#app').textContent;
var state=null;
try{state=JSON.parse($('#data').textContent)}catch(e){}
if(!state||!Array.isArray(state.groups))state={v:1,title:'我的导航',groups:[]};

var mode='pending', art=null, saveTimer=null, dirty=false, retried=false, ui={edit:false,q:''}, restoreScroll=0;
try{var st=JSON.parse(sessionStorage.getItem(SS)||'null');if(st){ui.edit=!!st.edit;restoreScroll=st.scroll||0}sessionStorage.removeItem(SS)}catch(e){}

function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360}
function normUrl(u){u=(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return u}
function validUrl(u){try{var x=new URL(u);return /^(https?|ftp):$/.test(x.protocol)}catch(e){return false}}
function mono(n){var c=Array.from((n||'?').trim())[0]||'?';return c.toUpperCase()}
function iconOf(s){if(s.icon)return s.icon;try{return new URL(s.url).origin+'/favicon.ico'}catch(e){return ''}}
function findG(id){return state.groups.find(function(g){return g.id===id})}
function total(){return state.groups.reduce(function(a,g){return a+g.sites.length},0)}
function words(){return ui.q.toLowerCase().split(/\s+/).filter(Boolean)}
function match(s,w){var t=(s.name+' '+s.url+' '+(s.note||'')).toLowerCase();return w.every(function(x){return t.indexOf(x)>-1})}

function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(state.title)+'</title>\n'+FONT+'\n<style id="css">'+CSS+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="data">'+json+END+'\n<script id="app">'+APP+END+'\n</body>\n</html>\n';
}

/* ---------- storage ----------
   数据保存在服务器上的 data.json（由 server.py 提供读写），
   浏览器 localStorage 只作为离线时的临时副本。 */
var API='data.json', TK='nav-hub-token';
var serverVer=null, saving=false, again=false, seq=0, tokenMem=null;
function validState(p){return !!(p&&typeof p==='object'&&Array.isArray(p.groups))}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function readLocal(){try{var p=JSON.parse(localStorage.getItem(LS)||'null');return validState(p)?p:null}catch(e){return null}}
function getToken(){if(tokenMem!==null)return tokenMem;try{return localStorage.getItem(TK)||''}catch(e){return ''}}
async function fetchServer(){
  var r=await fetch(API,{cache:'no-store'});
  if(r.status===404)return {missing:true};
  if(!r.ok)throw new Error('HTTP '+r.status);
  var p=await r.json();if(!validState(p))throw new Error('bad data');
  return {data:p,ver:r.headers.get('ETag')};
}
var storeReady=(async function(){
  if(location.protocol==='file:'){mode='local';var l=readLocal();if(l){state=l;renderAll()}setStatus();return}
  var cached=readLocal();
  try{
    var res=await fetchServer();
    mode='server';
    if(res.missing){
      // 服务器上还没有数据：用本浏览器已有的修改（没有就用默认列表）初始化
      if(cached){state=cached;renderAll()}
      seq++;dirty=true;
    }else{
      state=res.data;serverVer=res.ver;cacheLocal();renderAll();
    }
  }catch(e){
    mode='offline';if(cached){state=cached;renderAll()}
  }
  setStatus();
  if(dirty)save();
})();
function setStatus(msg){
  var el=$('#status');if(!el)return;
  if(msg){el.textContent=msg;return}
  var base='共 '+total()+' 个网站，';
  if(mode==='server')el.textContent=base+(dirty?'有更改未保存':'已保存到服务器');
  else if(mode==='offline')el.textContent=base+'连不上服务器，更改暂存本浏览器';
  else if(mode==='local')el.textContent=base+'仅保存在本浏览器';
  else el.textContent=base+'正在连接…';
}
function commit(){
  seq++;dirty=true;cacheLocal();renderContent();setStatus('有更改，稍后自动保存');
  clearTimeout(saveTimer);saveTimer=setTimeout(save,1200);
}
async function save(force){
  await storeReady;
  clearTimeout(saveTimer);
  if(!dirty)return;
  cacheLocal();
  if(mode==='local'){dirty=false;setStatus();return}
  if(saving){again=true;return}
  saving=true;var mySeq=seq;setStatus('保存中…');
  var h={'Content-Type':'application/json'},tk=getToken();
  if(tk)h['X-Nav-Token']=encodeURIComponent(tk);
  if(serverVer&&!force)h['If-Match']=serverVer;
  try{
    var r=await fetch(API,{method:'PUT',headers:h,body:JSON.stringify(state,null,1),cache:'no-store'});
    if(r.ok){
      mode='server';serverVer=r.headers.get('ETag')||null;
      if(mySeq===seq)dirty=false;
      setStatus();
    }else if(r.status===401||r.status===403){tokenDialog(!!tk)}
    else if(r.status===412){conflictDialog()}
    else if(r.status===405||r.status===501){mode='local';dirty=false;setStatus('服务器不支持保存，更改仅存于本浏览器')}
    else if(r.status===413){setStatus('数据过大，服务器拒绝保存')}
    else throw new Error('HTTP '+r.status);
  }catch(e){
    mode='offline';setStatus();saveTimer=setTimeout(save,15000);
  }
  saving=false;
  if(again){again=false;if(dirty)save()}
}
async function reloadFromServer(){
  try{
    var res=await fetchServer();if(res.missing)return;
    if(res.ver&&res.ver===serverVer&&mode==='server')return;
    state=res.data;serverVer=res.ver;mode='server';dirty=false;seq++;cacheLocal();renderAll();
  }catch(e){}
}
function tokenDialog(wrong){
  setStatus('未保存：需要密码');
  if($('#dlg').open)return;
  openDialog('输入保存密码','<p>'+(wrong?'密码不正确，请重新输入。':'服务器设置了保存密码。')+'这台设备会记住密码，以后不用再输。</p><label>密码<input name="pw" type="password" autocomplete="current-password"></label>',
    {okText:'保存',onOk:function(f){tokenMem=f.pw.value;try{localStorage.setItem(TK,f.pw.value)}catch(e){}setTimeout(save,0)}});
}
function conflictDialog(){
  setStatus('未保存：服务器上的数据已被修改');
  if($('#dlg').open)return;
  openDialog('数据已在别处修改','<p>你打开这个页面之后，服务器上的数据被其他设备或其他人修改过。</p><p>“载入服务器版本”会放弃你刚才的修改；“用我的覆盖”会用当前页面的内容替换服务器数据，被替换的版本会留在服务器的备份目录里。</p><div class="row"><button type="button" class="btn" data-load>载入服务器版本</button></div>',
    {okText:'用我的覆盖',danger:true,noFocus:true,onOk:function(){setTimeout(function(){save(true)},0)}});
  $('#dlg [data-load]').onclick=function(){$('#dlg').close();serverVer=null;reloadFromServer()};
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){if(dirty)save()}
  else if(mode!=='local'&&!dirty&&!$('#dlg').open)reloadFromServer();
});

var sortables=[];
function destroySortables(){sortables.forEach(function(x){try{x.destroy()}catch(e){}});sortables=[]}
function initSortables(){
  if(typeof Sortable!=='function')return;
  var common={animation:150,delay:180,delayOnTouchOnly:true,touchStartThreshold:4,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',dragClass:'sortable-drag',scroll:true,bubbleScroll:true};
  document.querySelectorAll('#content .grid[data-g]').forEach(function(grid){
    sortables.push(Sortable.create(grid,Object.assign({},common,{group:'sites',draggable:'.tw[data-s]',filter:'.tdel',preventOnFilter:false,
      onEnd:function(ev){if(ev.from===ev.to&&ev.oldIndex===ev.newIndex)return;syncSites()}})));
  });
  sortables.push(Sortable.create($('#content'),Object.assign({},common,{draggable:'.group',handle:'.ghandle',
    onEnd:function(ev){if(ev.oldIndex===ev.newIndex)return;syncGroups(Array.from(document.querySelectorAll('#content .group[data-gid]')).map(function(x){return x.getAttribute('data-gid')}))}})));
  sortables.push(Sortable.create($('#side'),Object.assign({},common,{draggable:'a[data-jump]',
    onEnd:function(ev){if(ev.oldIndex===ev.newIndex)return;syncGroups(Array.from(document.querySelectorAll('#side [data-jump]')).map(function(x){return x.getAttribute('data-jump')}))}})));
}
function syncSites(){
  var all={};state.groups.forEach(function(g){g.sites.forEach(function(x){all[x.id]=x})});
  document.querySelectorAll('#content .grid[data-g]').forEach(function(grid){
    var g=findG(grid.getAttribute('data-g'));if(!g)return;
    g.sites=Array.from(grid.querySelectorAll(':scope > .tw[data-s]')).map(function(el){return all[el.getAttribute('data-s')]}).filter(Boolean);
  });
  commit();
}
function syncGroups(order){
  state.groups.sort(function(a,b){return order.indexOf(a.id)-order.indexOf(b.id)});
  commit();
}
function onJump(e){
  var a=e.target.closest('[data-jump]');if(!a)return;e.preventDefault();
  var el=document.getElementById('g-'+a.getAttribute('data-jump'));
  if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function onAct(e){

  else if(act==='sortname'){var sg=findG(gid);
    openDialog('按名称排序','<p>将“'+esc(sg.name)+'”里的 '+sg.sites.length+' 个网站按名称重新排列（中文按拼音），当前的手动顺序会被替换。</p>',{okText:'排序',noFocus:true,onOk:function(){
      sg.sites.sort(function(a,b){return a.name.localeCompare(b.name,'zh-Hans-CN',{numeric:true,sensitivity:'base'})});commit()}})}
  else if(act==='delg'){var gg=findG(gid);
    confirmDialog('删除分组','确定删除分组“'+gg.name+'”'+(gg.sites.length?'及其中的 '+gg.sites.length+' 个网站':'')+'吗？','删除',function(){state.groups.splice(i,1);commit()})}
}

function parseLines(text){
  var out=[];
  text.split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var m=line.match(/https?:\/\/\S+/i)||line.match(/(?:^|[\s,，|｜\t])((?:[a-z0-9-]+\.)+[a-z]{2,}(?::\d+)?(?:\/\S*)?)/i)||line.match(/^((?:[a-z0-9-]+\.)+[a-z]{2,}(?::\d+)?(?:\/\S*)?)/i);
    if(!m)return;
    var raw=m[1]||m[0];var url=normUrl(raw);if(!validUrl(url))return;
    var name=line.replace(raw,'').replace(/^[\s,，|｜:：\-—\t]+|[\s,，|｜:：\-—\t]+$/g,'');
    out.push({name:name||hostOf(url),url:url});
  });
  return out;
}

   }});

function parseBookmarks(html){
  var doc=new DOMParser().parseFromString(html,'text/html'),map=new Map();
  doc.querySelectorAll('a[href]').forEach(function(a){
    var href=a.getAttribute('href')||'';if(!/^https?:/i.test(href))return;
    var name='导入的书签',dl=a.closest('dl'),dt=dl&&dl.parentElement?dl.parentElement.closest('dt'):null,h3=dt?dt.querySelector(':scope > h3'):null;
    if(h3&&h3.textContent.trim())name=h3.textContent.trim();
    if(!map.has(name))map.set(name,[]);
    map.get(name).push({name:(a.textContent||'').trim()||hostOf(href),url:href});
  });
  return map;
}
function mergeMap(map){
  var seen=new Set();state.groups.forEach(function(g){g.sites.forEach(function(s){seen.add(s.url.replace(/\/$/,''))})});
  var added=0,groups=0;
  map.forEach(function(list,name){
    var g=state.groups.find(function(x){return x.name===name});
    list.forEach(function(it){var k=it.url.replace(/\/$/,'');if(seen.has(k))return;seen.add(k);
      if(!g){g={id:uid(),name:name,sites:[]};state.groups.push(g);groups++}
      g.sites.push({id:uid(),name:it.name,url:it.url,note:''});added++});
  });
  return {added:added,groups:groups};
}
function toBookmarks(){
  var ts=Math.floor(Date.now()/1000),o=[];
  o.push('<!DOCTYPE NETSCAPE-Bookmark-file-1>','<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">','<TITLE>Bookmarks</TITLE>','<H1>Bookmarks</H1>','<DL><p>');
  o.push('    <DT><H3 ADD_DATE="'+ts+'" LAST_MODIFIED="'+ts+'">'+esc(state.title||'我的导航')+'</H3>','    <DL><p>');
  state.groups.forEach(function(g){
    o.push('        <DT><H3 ADD_DATE="'+ts+'" LAST_MODIFIED="'+ts+'">'+esc(g.name)+'</H3>','        <DL><p>');
    g.sites.forEach(function(s){o.push('            <DT><A HREF="'+esc(s.url)+'" ADD_DATE="'+ts+'">'+esc(s.name)+'</A>')});
    o.push('        </DL><p>');
  });
  o.push('    </DL><p>','</DL><p>');
  return o.join('\n')+'\n';
}
function ioDialog(){
  var f=openDialog('导入/导出',
   '<div class="sect"><h4>导出为浏览器书签</h4><p>下载一个书签文件，在浏览器里选“导入书签”即可。所有网站会放进名为“'+esc(state.title)+'”的文件夹，每个分组是一个子文件夹。</p><button type="button" class="btn sm primary" data-exportbm>下载书签文件</button><p class="msg3" hidden></p></div>'+
   '<div class="sect"><h4>导入浏览器书签</h4><p>在 Chrome 或 Edge 的书签管理器里选“导出书签”，得到一个 .html 文件，在这里选择它。按书签文件夹自动分组，重复网址会跳过。</p><input type="file" name="bm" accept=".html,.htm"><p class="msg" hidden></p></div>'+
   '<div class="sect"><h4>备份与恢复</h4><p>复制下面的内容保存起来即是完整备份；要恢复时，把备份粘贴进来再点“用此内容替换”。</p><textarea name="j" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-copy>复制备份</button><button type="button" class="btn sm" data-restore>用此内容替换</button></div><p class="msg2" hidden></p></div>',
   {wide:true,noFocus:true});
  f.j.value=JSON.stringify(state,null,1);
  function say(sel,t,bad){var p=f.querySelector(sel);p.hidden=false;p.textContent=t;p.className=sel.slice(1)+' '+(bad?'err':'ok')}
  f.bm.addEventListener('change',function(){
    var file=f.bm.files[0];if(!file)return;
    file.text().then(function(txt){
      var r=mergeMap(parseBookmarks(txt));
      if(!r.added){say('.msg','没有新增网站：文件里没有识别到书签，或全部已存在。',true);return}
      commit();f.j.value=JSON.stringify(state,null,1);
      say('.msg','已导入 '+r.added+' 个网站'+(r.groups?'，新建 '+r.groups+' 个分组':'')+'。');
    }).catch(function(){say('.msg','无法读取这个文件，请确认是浏览器导出的书签 .html。',true)});
  });
  f.querySelector('[data-exportbm]').onclick=async function(){
    var dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){}
    var d=new Date(),pad=function(n){return (n<10?'0':'')+n};
    if(!dl){
      var fn='书签-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.html';
      var url=URL.createObjectURL(new Blob([toBookmarks()],{type:'text/html;charset=utf-8'}));
      var a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},2000);
      say('.msg3','已下载。接下来在浏览器里导入这个文件。');return;
    }
    try{await dl.save({filename:'书签-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.html',data:toBookmarks()});say('.msg3','已下载。接下来在浏览器里导入这个文件。')}
    catch(err){var c=err&&err.code;
      if(c==='declined')say('.msg3','已取消下载。',true);
      else if(c==='rate_limited')say('.msg3','已有一个下载确认框在等待，请先处理它。',true);
      else say('.msg3','下载失败，请稍后再试。',true)}
  };
  f.querySelector('[data-copy]').onclick=function(){
    f.j.select();var ok=false;
    try{navigator.clipboard.writeText(f.j.value).then(function(){say('.msg2','已复制到剪贴板。')},function(){try{ok=document.execCommand('copy')}catch(e){}say('.msg2',ok?'已复制到剪贴板。':'复制失败，请手动全选复制。',!ok)})}
    catch(e){try{ok=document.execCommand('copy')}catch(e2){}say('.msg2',ok?'已复制到剪贴板。':'复制失败，请手动全选复制。',!ok)}
  };
  f.querySelector('[data-restore]').onclick=function(){
    var p;try{p=JSON.parse(f.j.value)}catch(e){say('.msg2','内容不是有效的备份 JSON。',true);return}
    if(!p||!Array.isArray(p.groups)){say('.msg2','内容缺少 groups 字段，不是本页面的备份。',true);return}
    p.groups.forEach(function(g){g.id=g.id||uid();g.name=String(g.name||'未命名');g.sites=(Array.isArray(g.sites)?g.sites:[]).filter(function(s){return s&&validUrl(normUrl(s.url))}).map(function(s){var o={id:s.id||uid(),name:String(s.name||hostOf(s.url)),url:normUrl(s.url),note:String(s.note||'')};if(s.icon)o.icon=String(s.icon);return o})});
    state={v:1,title:String(p.title||'我的导航'),groups:p.groups};document.title=state.title;commit();
    say('.msg2','已恢复。');
  };
}

document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')&&!$('#dlg').open){e.preventDefault();$('#q').focus()}
});

renderAll();
if(restoreScroll)requestAnimationFrame(function(){window.scrollTo(0,restoreScroll)});
})();
</script>
</body>
</html>
